[package]
name = "spillforge"
version = "0.1.0"
edition = "2021"
publish = false
description = "Forced-WDDM-spill fixture for validating hypomnesis spill detection (Windows-only)"
license = "MIT OR Apache-2.0"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
]

[profile.dev]
opt-level = 1

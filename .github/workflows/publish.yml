name: Publish to crates.io

on:
  push:
    # Publish on release tags of the form vMAJOR.MINOR.PATCH (e.g. v0.0.1, v0.1.0).
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Fail fast on a mistyped/mismatched tag before burning CI minutes
      # on the full gate suite below. Guarded to the tag-push trigger —
      # a manual workflow_dispatch re-run has no tag context to check.
      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          CARGO_VERSION="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches Cargo.toml version $CARGO_VERSION"

      # Full CI checks before publishing
      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (defaults)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

      - name: Doc check
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      # Publish — requires the CARGO_REGISTRY_TOKEN repository secret
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

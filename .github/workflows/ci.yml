name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # Cross-platform matrix: hypomnesis has Windows-only `dxgi`/`pdh`,
    # macOS-only `metal`, and cross-platform `nvml` /
    # `nvidia-smi-fallback` paths; all three OSes must build clean on
    # MSRV (1.88) and stable.
    name: ${{ matrix.os }} / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: ["1.88", "stable"]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      # README documents two non-default configurations (bare RSS-only,
      # and a library-only set with no `clap`/`ctrlc`); check both here
      # so they can't silently drift from what's advertised.
      - name: Check (no default features)
        run: cargo check --no-default-features

      - name: Check (library-only feature set)
        run: cargo check --no-default-features --features nvml,dxgi,pdh

      - name: Clippy (defaults)
        run: cargo clippy --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  doc:
    # Separate doc-check job: catches broken intra-doc links early
    # (publish.yml also runs this, but waiting until release is too late).
    name: Doc check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Doc check
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

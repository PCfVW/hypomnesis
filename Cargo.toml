[package]
name = "hypomnesis"
version = "0.2.7"
edition = "2024"
authors = ["Eric Jacopin"]
description = "External RAM and VRAM measurement for Rust processes (process RSS plus per-process and device-wide GPU memory: Windows DXGI + NVML + PDH, Linux NVML, macOS libSystem + Metal, with nvidia-smi fallback)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mi-for-the-rust-of-us/hypomnesis"
homepage = "https://github.com/mi-for-the-rust-of-us/hypomnesis"
documentation = "https://docs.rs/hypomnesis"
keywords = ["memory", "vram", "nvml", "dxgi", "gpu"]
categories = ["os", "memory-management", "hardware-support"]
rust-version = "1.88"

[dependencies]
thiserror = "2"

# Optional: NVML dynamic load (Linux + Windows-WDDM device-wide)
libloading = { version = "0.9", optional = true }

# Optional: clap CLI parser for the `hmn` binary (cli feature only)
clap = { version = "4", optional = true, features = ["derive"] }

# Optional: Ctrl+C handling for `hmn watch`'s graceful closing summary
# (cli feature only). Safe cross-platform API (SetConsoleCtrlHandler on
# Windows, sigaction on Unix) — no unsafe code added to this crate.
ctrlc = { version = "3", optional = true }

# Optional: per-process VRAM on Windows via DXGI (IDXGIAdapter3::QueryVideoMemoryInfo)
# and PDH (Performance Data Helper for `\GPU Process Memory(*)\Dedicated Usage`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Performance",
    "Win32_System_Threading",
] }

# Optional: MTLDevice.recommendedMaxWorkingSetSize for device-wide free-bytes
# on Apple Silicon UMA. Minimal feature set — only `MTLDevice` is enabled,
# which gates both `MTLCreateSystemDefaultDevice` and the device-property
# reads we need; default features (every other MTL* type) are deliberately
# disabled. `objc2` is already a transitive of `objc2-metal`, but the static
# OnceLock<Retained<ProtocolObject<dyn MTLDevice>>> declaration in
# `src/gpu/metal.rs` names types from `objc2::rc` and `objc2::runtime`, so
# the crate must be a direct dependency.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = { version = "0.3", optional = true, default-features = false, features = ["MTLDevice"] }
objc2 = { version = "0.6", optional = true }

[features]
default = ["nvml", "nvidia-smi-fallback", "dxgi", "pdh", "metal"]
nvml = ["dep:libloading"]
nvidia-smi-fallback = []
dxgi = ["dep:windows"]
# `pdh` (Windows-only effect) reads `\GPU Process Memory(*)\Dedicated Usage`
# via Performance Data Helper for foreign-process per-process VRAM under
# consumer WDDM, where NVML returns NVML_VALUE_NOT_AVAILABLE. Shares the
# `windows` crate dep with `dxgi`; target-conditional, no-op off-Windows.
# Depends on `dxgi` because `pdh` correlates PDH counter instances against
# the calling adapter's LUID, which is fetched via the DXGI adapter walk
# already used by the calling-process fast path (`dxgi::adapter_luid`).
pdh = ["dep:windows", "dxgi"]
# `metal` (macOS-only effect) reads `MTLDevice.recommendedMaxWorkingSetSize`
# for device-wide free-bytes on Apple Silicon UMA via a minimal `objc2-metal`
# binding. Per-process accounting comes from libSystem (`ledger` syscall);
# only the device-wide free-bytes figure needs the Metal API. Target-conditional,
# no-op off-macOS.
metal = ["dep:objc2-metal", "dep:objc2"]
report = []
debug-output = []
# `cli` is default-off so library users don't pull `clap`; install the
# binary with `cargo install hypomnesis --features cli`. `ctrlc` backs
# `hmn watch`'s graceful Ctrl+C closing summary.
cli = ["dep:clap", "dep:ctrlc"]
# `test-helpers` exposes a `GpuDeviceInfoBuilder` for downstream tests
# that need synthetic fixtures of the `#[non_exhaustive]` `GpuDeviceInfo`
# type. Default-off, additive — production code must never enable it.
test-helpers = []

[[example]]
name = "print_demo"
required-features = ["report"]

[[bin]]
name = "hmn"
required-features = ["cli"]

[lints.rust]
elided_lifetimes_in_paths = "deny"
missing_docs              = "warn"

[lints.clippy]
# Rule 3: No panics or indexing in library code
unwrap_used               = "deny"
expect_used               = "deny"
panic                     = "deny"
indexing_slicing          = "deny"

# Rule 7: Exhaustive matching
wildcard_enum_match_arm             = "deny"
match_wildcard_for_single_variants  = "deny"

# Rule 11: #[non_exhaustive] policy
exhaustive_enums          = "warn"

# Rule 2: Explicit conversions (warn — numeric casts need annotation, not prohibition)
as_conversions            = "warn"
cast_possible_truncation  = "warn"
cast_precision_loss       = "warn"
cast_sign_loss            = "warn"

# Rule 9: Prefer iterators
explicit_iter_loop        = "warn"
manual_filter_map         = "warn"
manual_find_map           = "warn"
needless_range_loop       = "warn"

# Documentation
missing_docs_in_private_items = "warn"
missing_errors_doc        = "warn"
missing_panics_doc        = "warn"

# General pedantic + nursery quality baseline
pedantic  = { level = "warn", priority = -1 }
nursery   = { level = "warn", priority = -1 }

# Suppressed lints that are too noisy for this domain
module_name_repetitions   = "allow"
too_many_lines            = "allow"
must_use_candidate        = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 1

# docs.rs builds the full feature set on Linux, Windows, and macOS targets
# so the rendered documentation includes the Windows-only `dxgi` / `pdh`
# modules and the macOS-only `metal` module alongside the cross-platform
# `nvml` and `nvidia_smi` backends.
[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin"]
